<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    :root {
      --primary: #1e40af;
      --primary-light: #3b82f6;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
    
    /* Top Bar */
    .topbar {
      background: var(--primary); color: #fff; padding: 14px 24px;
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .brand { font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .brand-logo { width: 42px; height: 42px; object-fit: contain; border-radius: 50%; background: #fff; padding: 2px; box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
    .role-switcher { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .role-switcher span { font-size: 0.85rem; opacity: 0.9; }
    .role-btn {
      border: 1px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.12); color: #fff;
      padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: 0.2s;
    }
    .role-btn.active { background: #fff; color: var(--primary); border-color: #fff; }

    /* Layout */
    .container { max-width: 1200px; margin: 20px auto; padding: 0 16px; display: grid; grid-template-columns: 230px 1fr; gap: 20px; }
    @media (max-width: 820px) { .container { grid-template-columns: 1fr; } }

    /* Sidebar */
    .sidebar { background: var(--card); border-radius: 12px; padding: 12px; border: 1px solid var(--border); height: fit-content; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
      padding: 10px 14px; border: none; background: transparent; border-radius: 8px;
      cursor: pointer; font-size: 0.92rem; font-weight: 500; color: var(--text); margin-bottom: 4px;
    }
    .nav-item:hover { background: #f8fafc; }
    .nav-item.active { background: #eff6ff; color: var(--primary); font-weight: 700; }
    .nav-item.hidden { display: none; }

    /* Main Content */
    .main { display: flex; flex-direction: column; gap: 16px; }
    .card { background: var(--card); border-radius: 12px; padding: 20px; border: 1px solid var(--border); }
    .card-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    .card-title { font-size: 1.15rem; font-weight: 700; }
    .badge { padding: 3px 10px; border-radius: 12px; font-size: 0.78rem; font-weight: 600; display: inline-block; }
    .badge-green { background: #dcfce7; color: #166534; }
    .badge-red { background: #fee2e2; color: #991b1b; }
    .badge-yellow { background: #fef3c7; color: #92400e; }
    .badge-blue { background: #dbeafe; color: #1e40af; }

    /* Stats Grid */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .stat-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
    .stat-label { font-size: 0.8rem; color: var(--muted); }
    .stat-val { font-size: 1.4rem; font-weight: 700; margin-top: 4px; }

    /* Table */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: #f8fafc; color: var(--muted); font-weight: 600; font-size: 0.82rem; text-transform: uppercase; }

    /* Controls */
    .btn {
      padding: 7px 14px; border-radius: 8px; border: none; cursor: pointer;
      font-size: 0.85rem; font-weight: 600; background: var(--primary); color: #fff;
    }
    .btn-sm { padding: 4px 10px; font-size: 0.78rem; }
    .btn-outline { background: #fff; color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: var(--danger); color: #fff; }
    input, select {
      padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.88rem;
    }
    .form-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; align-items: center; }

    .att-btn { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
    .att-btn.present.active { background: var(--success); color: #fff; border-color: var(--success); }
    .att-btn.absent.active { background: var(--danger); color: #fff; border-color: var(--danger); }
    .att-btn.late.active { background: var(--warning); color: #fff; border-color: var(--warning); }

    .notice { background: #eff6ff; border-left: 4px solid var(--primary); padding: 10px 14px; border-radius: 6px; font-size: 0.86rem; color: #1e3a8a; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 8px; }
    .cal-head { text-align: center; font-size: 0.78rem; font-weight: 700; color: var(--muted); padding: 6px 0; background: #f8fafc; border-radius: 6px; }
    .cal-cell { min-height: 74px; border: 1px solid var(--border); border-radius: 8px; padding: 6px; background: #fff; font-size: 0.78rem; cursor: pointer; transition: border-color 0.15s; }
    .cal-cell:hover { border-color: var(--primary); }
    .cal-cell.empty { background: #f8fafc; border-style: dashed; cursor: default; }
    .cal-day { font-weight: 700; margin-bottom: 4px; color: var(--text); }

    /* Login Screen Overlay (Test UI) */
    #loginOverlay { position: fixed; inset: 0; background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 16px; }
    #loginOverlay.hidden { display: none; }
    .login-card { background: #fff; border-radius: 14px; box-shadow: 0 20px 50px rgba(0,0,0,0.35); width: 100%; max-width: 400px; padding: 28px 26px; }
    .login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .login-brand img { width: 48px; height: 48px; border-radius: 10px; object-fit: contain; background: #f8fafc; padding: 4px; border: 1px solid var(--border); }
    .login-field { margin-bottom: 14px; }
    .login-field label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
    .login-field input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.92rem; box-sizing: border-box; }
    .login-field input:focus { outline: none; border-color: var(--primary); }
    .login-submit { width: 100%; padding: 11px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 700; cursor: pointer; margin-top: 4px; }
    .login-submit:hover { opacity: 0.92; }
    .login-divider { text-align: center; font-size: 0.76rem; color: var(--muted); margin: 18px 0 10px; position: relative; }
    .login-quick-btns { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .login-quick-btn { padding: 6px 10px; font-size: 0.78rem; border: 1px solid var(--border); background: #f8fafc; border-radius: 6px; cursor: pointer; font-weight: 600; color: var(--text); }
    .login-quick-btn:hover { background: #eff6ff; border-color: var(--primary); color: var(--primary); }
  </style>
</head>

      if (!teacherName) return '';
      for (const [classKey, assigned] of Object.entries(classTeacherAssignments)) {
        if (assigned && (assigned.lead === teacherName || assigned.assistant === teacherName)) {
          return classKey;
        }
      }
      return '';
    }

    async function handleLogin(e) {
      e.preventDefault();
      showLoginError('');
      if (!supabaseClient) {
        showLoginError('Supabase is not connected yet. Please set SUPABASE_URL and SUPABASE_ANON_KEY first.');
        return;
      }
      const loginId = (document.getElementById('loginId').value || '').trim();
      const password = document.getElementById('loginPw').value || '';
      const btn = document.getElementById('loginSubmitBtn');
      btn.disabled = true;
      btn.textContent = 'Signing In...';
      try {
        if (loginId.includes('@')) {
          // Admin login via Supabase Auth
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email: loginId, password });
          if (error) throw error;
          await onAdminAuthenticated(data.user);
        } else {
          // Staff / Teacher / Parent login via Phone Number + Password
          await loginWithPhone(loginId, password);
        }
      } catch (err) {
        showLoginError(err.message || 'Login failed. Please check your ID (email or phone number) and password.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    async function onAdminAuthenticated(user) {
      authMode = 'supabase';
      currentPhoneSession = null;
      try { sessionStorage.removeItem('pma_phone_session'); } catch (_) {}
      currentUserLabel = user.email || 'Admin';
      isAuthenticated = true;
      await loadPortalState();
      document.getElementById('loginOverlay').classList.add('hidden');
      setRole('admin');
    }

    async function loginWithPhone(phone, password) {
      const { data, error } = await supabaseClient.rpc('portal_phone_login', {
        p_phone: phone,
        p_password: password
      });
      if (error) throw new Error(error.message || 'A server login error occurred.');
      if (!data || !data.ok) {
        throw new Error((data && data.error) || 'Invalid phone number or password.');
      }

      isLoadingState = true;
      try {
        if (data.state) applyPortalState(data.state);
      } finally {
        isLoadingState = false;
      }

      const role = data.role || 'teacher';
      authMode = 'phone';
      currentPhoneSession = {
        phone: data.phone || phone,
        password,
        role,
        name: data.name || ''
      };
      try {
        sessionStorage.setItem('pma_phone_session', JSON.stringify(currentPhoneSession));
      } catch (_) {}

      currentUserLabel = data.name ? `${data.name} · ${currentPhoneSession.phone}` : currentPhoneSession.phone;
      if (role === 'parent') {
        currentParentPhone = currentPhoneSession.phone;
      } else if (role === 'teacher' && data.name) {
        const assigned = findTeacherAssignedClass(data.name);
        if (assigned) teacherAssignedClass = assigned;
      }

      isAuthenticated = true;
      setSaveStatus(role === 'parent' ? 'Read-Only' : 'Synced');
      document.getElementById('loginOverlay').classList.add('hidden');
      setRole(role);
    }

    async function logout() {
      isAuthenticated = false;
      authMode = '';
      currentUserLabel = '';
      currentPhoneSession = null;
      try { sessionStorage.removeItem('pma_phone_session'); } catch (_) {}
      if (supabaseClient) {
        try { await supabaseClient.auth.signOut(); } catch (_) {}
      }
      document.getElementById('loginId').value = '';
      document.getElementById('loginPw').value = '';
      showLoginError('');
      setSaveStatus('');
      document.getElementById('loginOverlay').classList.remove('hidden');
    }

    function setTab(tab) {
      currentTab = tab;
      updateSidebar();
      render();
    }

    function updateSidebar() {
      const allowed = rolePermissions[currentRole];
      document.querySelectorAll('.nav-item').forEach(btn => {
        const tab = btn.dataset.tab;
        btn.classList.toggle('hidden', !allowed.includes(tab));
        btn.classList.toggle('active', tab === currentTab);
      });
    }

    function render() {
      const main = document.getElementById('mainContent');
      if (currentTab === 'calendar') main.innerHTML = renderCalendar();
      else if (currentTab === 'attendance') main.innerHTML = renderAttendance();
      else if (currentTab === 'grades') main.innerHTML = renderGrades();
      else if (currentTab === 'biodata') main.innerHTML = renderBiodata();
      else if (currentTab === 'parent_biodata') main.innerHTML = renderParentBiodata();
      else if (currentTab === 'staff_biodata') main.innerHTML = renderStaffBiodata();
      else if (currentTab === 'bills') main.innerHTML = renderBills();
      else if (currentTab === 'finance') main.innerHTML = renderFinance();
      else if (currentTab === 'access') main.innerHTML = renderAccess();
      else if (currentTab === 'settings') main.innerHTML = renderSettings();
      if (isAuthenticated && !isLoadingState) scheduleSave();
    }

    function renderCalendar() {
      const canEdit = currentRole === 'admin' || currentRole === 'vice_admin';
      return `
        <div class="card">
          <div class="card-header">
            <div class="card-title">📅 Academic Calendar</div>
            <span class="badge badge-blue">Visible to All Roles</span>
          </div>
          ${canEdit ? `
            <div class="form-row">
              <input type="date" id="evDate" value="2026-12-01" />
              <input type="text" id="evTitle" placeholder="Event title..." style="flex:1; min-width:180px;" />
              <select id="evType"><option>Academic</option><option>Holiday</option><option>Event</option></select>
              <button class="btn" onclick="addEvent()">+ Add Event</button>
            </div>
          ` : `<div class="notice" style="margin-bottom:14px;">View-only mode. Only Admin can add or edit calendar events.</div>`}
          <div class="table-wrap">
            <table>
              <thead><tr><th>Date</th><th>Event</th><th>Type</th>${canEdit ? '<th>Action</th>' : ''}</tr></thead>
              <tbody>
                ${calendarEvents.map(e => `
                  <tr>
                    <td><strong>${e.date}</strong></td>
                    <td>${e.title}</td>
                    <td><span class="badge ${e.type==='Holiday'?'badge-red':e.type==='Academic'?'badge-blue':'badge-green'}">${e.type}</span></td>
                    ${canEdit ? `<td><button class="btn btn-sm btn-danger" onclick="deleteEvent(${e.id})">Delete</button></td>` : ''}
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function addEvent() {
      const date = document.getElementById('evDate').value;
      const title = document.getElementById('evTitle').value.trim();
      const type = document.getElementById('evType').value;
      if (!date || !title) return alert('Please enter date and title.');
      calendarEvents.push({ id: Date.now(), date, title, type });
      render();
    }
    function deleteEvent(id) {
      const idx = calendarEvents.findIndex(e => e.id === id);
      if (idx > -1) calendarEvents.splice(idx, 1);
      render();
    }

    function getWeekDates(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      const day = d.getDay(); // 0=Sun..6=Sat
      const diffToMon = day === 0 ? -6 : 1 - day;
      const mon = new Date(d);
      mon.setDate(d.getDate() + diffToMon);
      const dates = [];
      for (let i = 0; i < 5; i++) {
        const cur = new Date(mon);
        cur.setDate(mon.getDate() + i);
        dates.push(cur.toISOString().slice(0, 10));
      }
      return dates;
    }

    function renderAttendance() {
      const classes = [...new Set(students.map(s => `${s.level} - ${s.section}`))];
      const targetStudents = attScope === 'individual'
        ? students.filter(s => s.id === attStudentId)
        : (attClassFilter === 'ALL' ? students : students.filter(s => `${s.level} - ${s.section}` === attClassFilter));

      const statusBadge = (st) => {
        if (!st) return '<span style="color:var(--muted);">-</span>';
        const cls = st === 'Present' ? 'badge-green' : st === 'Absent' ? 'badge-red' : 'badge-yellow';
        return `<span class="badge ${cls}">${st}</span>`;
      };

      let bodyHtml = '';
      if (attPeriod === 'daily') {
        const dayData = attendance[selectedDate] || {};
        bodyHtml = `
          <table>
            <thead><tr><th>Student</th><th>Level & Section</th><th>Mark (${selectedDate})</th><th>Status</th></tr></thead>
            <tbody>
              ${targetStudents.map(s => {
                const status = dayData[s.id] || '';
                return `
                  <tr>
                    <td><strong>${s.name}</strong><br><small style="color:var(--muted)">LRN: ${s.lrn}</small></td>
                    <td>${s.level} - ${s.section}</td>
                    <td>
                      <button class="att-btn present ${status==='Present'?'active':''}" onclick="markAtt(${s.id},'Present')">Present</button>
                      <button class="att-btn absent ${status==='Absent'?'active':''}" onclick="markAtt(${s.id},'Absent')">Absent</button>
                      <button class="att-btn late ${status==='Late'?'active':''}" onclick="markAtt(${s.id},'Late')">Late</button>
                    </td>
                    <td>${statusBadge(status)}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        `;
      } else if (attPeriod === 'weekly') {
        const weekDates = getWeekDates(selectedDate);
        bodyHtml = `
          <table>
            <thead>
              <tr>
                <th>Student</th>
                ${weekDates.map(dt => `<th>${dt.slice(5)}</th>`).join('')}
                <th>Weekly Total (P/A/L)</th>
              </tr>
            </thead>
            <tbody>
              ${targetStudents.map(s => {
                let p = 0, a = 0, l = 0;
                const cells = weekDates.map(dt => {
                  const st = (attendance[dt] && attendance[dt][s.id]) || '';
                  if (st === 'Present') p++;
                  else if (st === 'Absent') a++;
                  else if (st === 'Late') l++;
                  return `<td>${statusBadge(st)}</td>`;
                }).join('');
                return `
                  <tr>
                    <td><strong>${s.name}</strong><br><small style="color:var(--muted)">${s.level} - ${s.section}</small></td>
                    ${cells}
                    <td>
                      <span class="badge badge-green">P: ${p}</span>
                      <span class="badge badge-red">A: ${a}</span>
                      <span class="badge badge-yellow">L: ${l}</span>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        `;
      } else {
        const monthPrefix = selectedDate.slice(0, 7);
        const monthDates = Object.keys(attendance).filter(dt => dt.startsWith(monthPrefix)).sort();
        const viewToggle = `
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:12px;">
            <div class="notice" style="margin:0;">Showing monthly data for <strong>${monthPrefix}</strong> (${monthDates.length} recorded school days).</div>
            <div style="display:flex; gap:4px;">
              <button class="btn btn-sm ${attMonthlyView==='summary'?'':'btn-outline'}" onclick="attMonthlyView='summary'; render();">Summary Table</button>
              <button class="btn btn-sm ${attMonthlyView==='calendar'?'':'btn-outline'}" onclick="attMonthlyView='calendar'; render();">Calendar View</button>
            </div>
          </div>
        `;

        if (attMonthlyView === 'calendar') {
          const [yr, mo] = monthPrefix.split('-').map(Number);
          const firstDay = new Date(yr, mo - 1, 1).getDay();
          const daysInMonth = new Date(yr, mo, 0).getDate();
          const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
          let cells = dayNames.map(d => `<div class="cal-head">${d}</div>`).join('');
          for (let i = 0; i < firstDay; i++) cells += `<div class="cal-cell empty"></div>`;
          for (let day = 1; day <= daysInMonth; day++) {
            const dt = `${monthPrefix}-${String(day).padStart(2, '0')}`;
            const dayRec = attendance[dt] || {};
            let cellInfo = '';
            if (attScope === 'individual') {
              const st = dayRec[attStudentId] || '';
              cellInfo = st ? statusBadge(st) : '';
            } else {
              let p = 0, a = 0, l = 0;
              targetStudents.forEach(s => {
                const st = dayRec[s.id];
                if (st === 'Present') p++;
                else if (st === 'Absent') a++;
                else if (st === 'Late') l++;
              });
              if (p + a + l > 0) {
                cellInfo = `<div style="display:flex; flex-direction:column; gap:2px;">
                  ${p ? `<span class="badge badge-green">P: ${p}</span>` : ''}
                  ${a ? `<span class="badge badge-red">A: ${a}</span>` : ''}
                  ${l ? `<span class="badge badge-yellow">L: ${l}</span>` : ''}
                </div>`;
              }
            }
            cells += `<div class="cal-cell" title="Click to view/edit ${dt}" onclick="selectedDate='${dt}'; attPeriod='daily'; render();"><div class="cal-day">${day}</div>${cellInfo}</div>`;
          }
          bodyHtml = `${viewToggle}<div class="cal-grid">${cells}</div>`;
        } else {
          bodyHtml = `
            ${viewToggle}
            <table>
              <thead><tr><th>Student</th><th>Level & Section</th><th>Present</th><th>Absent</th><th>Late</th><th>Attendance Rate</th></tr></thead>
              <tbody>
                ${targetStudents.map(s => {
                  let p = 0, a = 0, l = 0;
                  monthDates.forEach(dt => {
                    const st = attendance[dt][s.id];
                    if (st === 'Present') p++;
                    else if (st === 'Absent') a++;
                    else if (st === 'Late') l++;
                  });
                  const total = p + a + l;
                  const rate = total > 0 ? Math.round(((p + l) / total) * 100) + '%' : '-';
                  return `
                    <tr>
                      <td><strong>${s.name}</strong><br><small style="color:var(--muted)">LRN: ${s.lrn}</small></td>
                      <td>${s.level} - ${s.section}</td>
                      <td><span class="badge badge-green">${p}</span></td>
                      <td><span class="badge badge-red">${a}</span></td>
                      <td><span class="badge badge-yellow">${l}</span></td>
                      <td><strong>${rate}</strong></td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          `;
        }
      }

      return `
        <div class="card">
          <div class="card-header">
            <div class="card-title">✅ Attendance (${attPeriod.toUpperCase()} - ${attScope === 'class' ? 'By Class' : 'Individual'})</div>
            <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
              <label style="font-size:0.85rem;">Date:</label>
              <input type="date" value="${selectedDate}" onchange="selectedDate=this.value; render();" />
            </div>
          </div>

          <div class="form-row">
            <div style="display:flex; gap:4px;">
              <button class="btn btn-sm ${attPeriod==='daily'?'':'btn-outline'}" onclick="attPeriod='daily'; render();">Daily</button>
              <button class="btn btn-sm ${attPeriod==='weekly'?'':'btn-outline'}" onclick="attPeriod='weekly'; render();">Weekly</button>
              <button class="btn btn-sm ${attPeriod==='monthly'?'':'btn-outline'}" onclick="attPeriod='monthly'; render();">Monthly</button>
            </div>
            <div style="display:flex; gap:4px;">
              <button class="btn btn-sm ${attScope==='class'?'':'btn-outline'}" onclick="attScope='class'; render();">By Class</button>
              <button class="btn btn-sm ${attScope==='individual'?'':'btn-outline'}" onclick="attScope='individual'; render();">Individual</button>
            </div>
            ${attScope === 'class' ? `
              <select onchange="attClassFilter=this.value; render();">
                <option value="ALL" ${attClassFilter==='ALL'?'selected':''}>All Classes</option>
                ${classes.map(c => `<option value="${c}" ${attClassFilter===c?'selected':''}>${c}</option>`).join('')}
              </select>
            ` : `
              <select onchange="attStudentId=Number(this.value); render();">
                ${students.map(s => `<option value="${s.id}" ${s.id===attStudentId?'selected':''}>${s.name} (${s.level} - ${s.section})</option>`).join('')}
              </select>
            `}
          </div>

          <div class="table-wrap">${bodyHtml}</div>
        </div>
      `;
    }

    function markAtt(sid, status) {
      if (!attendance[selectedDate]) attendance[selectedDate] = {};
      attendance[selectedDate][sid] = status;
      render();
    }

    function renderGrades() {
      const canEdit = currentRole === 'admin' || currentRole === 'vice_admin' || currentRole === 'teacher';
      let visibleStudents = students;
      if (currentRole === 'parent') {
        visibleStudents = students.filter(s => normalizePhone(s.phone) === normalizePhone(currentParentPhone));
      } else if (currentRole === 'teacher') {
        visibleStudents = students.filter(s => `${s.level} - ${s.section}` === teacherAssignedClass);
      }
      if (visibleStudents.length === 0) {
        return `<div class="card"><div class="card-header"><div class="card-title">📊 Student Grades (3 Terms)</div></div><div class="notice">No students found in your assigned class (${teacherAssignedClass}).</div></div>`;
      }
      if (!visibleStudents.find(s => s.id === selectedParentChildId)) selectedParentChildId = visibleStudents[0].id;
      const list = grades[selectedParentChildId] || [];
      if (!gradeComments[selectedParentChildId]) gradeComments[selectedParentChildId] = { q1: '', q2: '', q3: '' };
      const comments = gradeComments[selectedParentChildId];
      const quartersToShow = gradeViewMode === 'all' ? ['q1', 'q2', 'q3'] : [gradeViewMode];
      const qLabels = { q1: 'Term 1', q2: 'Term 2', q3: 'Term 3' };

      return `
        <div class="card" style="margin-bottom:20px;">
          <div class="card-header" style="flex-wrap:wrap; gap:10px;">
            <div class="card-title">📊 Student Grades ${currentRole === 'teacher' ? `<span class="badge badge-blue" style="margin-left:8px;">Assigned: ${teacherAssignedClass}</span>` : ''}</div>
            <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
              <select onchange="gradeViewMode=this.value; render();">
                <option value="all" ${gradeViewMode==='all'?'selected':''}>All Terms</option>
                <option value="q1" ${gradeViewMode==='q1'?'selected':''}>Term 1 Only</option>
                <option value="q2" ${gradeViewMode==='q2'?'selected':''}>Term 2 Only</option>
                <option value="q3" ${gradeViewMode==='q3'?'selected':''}>Term 3 Only</option>
              </select>
              <select onchange="selectedParentChildId=Number(this.value); render();">
                ${visibleStudents.map(s => `<option value="${s.id}" ${s.id===selectedParentChildId?'selected':''}>${s.name} (${s.level} - ${s.section})</option>`).join('')}
              </select>
            </div>
          </div>
          ${canEdit ? `
            <div class="form-row" style="background:#f8fafc; padding:10px 12px; border-radius:8px; border:1px solid var(--border); margin-bottom:14px;">
              <input type="text" id="newSubjectInput" placeholder="New Subject Name (e.g. Filipino)" style="flex:1; min-width:200px;" />
              <button class="btn" onclick="addSubject(${selectedParentChildId})">+ Add Subject</button>
            </div>
          ` : ''}
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Subject</th>
                  ${quartersToShow.map(q => `<th>${qLabels[q]}</th>`).join('')}
                  ${gradeViewMode === 'all' ? '<th>Final Avg</th>' : ''}
                  ${canEdit ? '<th>Action</th>' : ''}
                </tr>
              </thead>
              <tbody>
                ${list.map((g, i) => {
                  const avg = ((g.q1 + g.q2 + g.q3) / 3).toFixed(1);
                  return `
                    <tr>
                      <td>
                        ${canEdit
                          ? `<input type="text" value="${g.subject}" style="width:100%; min-width:160px; font-weight:600;" onchange="updateSubjectName(${selectedParentChildId},${i},this.value)" />`
                          : `<strong>${g.subject}</strong>`}
                      </td>
                      ${quartersToShow.map(q => `
                        <td>${canEdit ? `<input type="number" min="60" max="100" value="${g[q]}" style="width:70px" onchange="updateGrade(${selectedParentChildId},${i},'${q}',this.value)">` : g[q]}</td>
                      `).join('')}
                      ${gradeViewMode === 'all' ? `<td><span class="badge ${avg>=75?'badge-green':'badge-red'}">${avg}</span></td>` : ''}
                      ${canEdit ? `<td><button class="btn btn-sm btn-danger" onclick="removeSubject(${selectedParentChildId},${i})">Delete</button></td>` : ''}
                    </tr>
                  `;
                }).join('')}
              </tbody>
              ${list.length > 0 ? `
                <tfoot>
                  <tr style="background:#f8fafc; font-weight:700; border-top:2px solid var(--border);">
                    <td>Term Average</td>
                    ${quartersToShow.map(q => {
                      const termAvg = (list.reduce((sum, g) => sum + (Number(g[q]) || 0), 0) / list.length).toFixed(1);
                      return `<td><span class="badge ${termAvg>=75?'badge-green':'badge-red'}">${termAvg}</span></td>`;
                    }).join('')}
                    ${gradeViewMode === 'all' ? (() => {
                      const finalAvg = (list.reduce((sum, g) => sum + ((g.q1 + g.q2 + g.q3) / 3), 0) / list.length).toFixed(1);
                      return `<td><span class="badge ${finalAvg>=75?'badge-green':'badge-red'}">${finalAvg}</span></td>`;
                    })() : ''}
                    ${canEdit ? '<td></td>' : ''}
                  </tr>
                </tfoot>
              ` : ''}
            </table>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title">💬 Teacher's Comment for Parents (By Term)</div>
          </div>
          <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap:14px;">
            ${quartersToShow.map(q => `
              <div style="background:#f8fafc; padding:12px; border-radius:8px; border:1px solid var(--border);">
                <div style="font-weight:600; margin-bottom:6px; color:var(--primary);">${qLabels[q]}</div>
                ${canEdit
                  ? `<textarea rows="3" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; font-family:inherit;" placeholder="Write a message for parents..." onchange="updateGradeComment(${selectedParentChildId},'${q}',this.value)">${comments[q] || ''}</textarea>`
                  : `<p style="margin:0; color:#334155; font-size:14px;">${comments[q] || 'No comment yet.'}</p>`}
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function updateGrade(sid, idx, q, val) {
      grades[sid][idx][q] = Number(val) || 0;
      render();
    }

    function addSubject(sid) {
      const input = document.getElementById('newSubjectInput');
      const subject = input.value.trim();
      if (!subject) return alert('Please enter a subject name.');
      if (!grades[sid]) grades[sid] = [];
      grades[sid].push({ subject, q1: 75, q2: 75, q3: 75 });
      render();
    }

    function updateSubjectName(sid, idx, val) {
      const name = val.trim();
      if (name) {
        grades[sid][idx].subject = name;
        scheduleSave();
      }
    }

    function removeSubject(sid, idx) {
      grades[sid].splice(idx, 1);
      render();
    }

    function updateGradeComment(sid, q, val) {
      if (!gradeComments[sid]) gradeComments[sid] = { q1: '', q2: '', q3: '' };
      gradeComments[sid][q] = val;
      scheduleSave();
    }

    function renderBiodata() {
      const canEdit = currentRole === 'admin' || currentRole === 'vice_admin' || currentRole === 'teacher' || currentRole === 'cashier';
      return `
        <div class="card">
          <div class="card-header">
            <div class="card-title">👨‍🎓 Student Biodata</div>
            <span class="badge badge-blue">Admin, Teacher & Cashier Access</span>
          </div>
          <div class="notice" style="margin-bottom:14px;">
            ℹ️ Entering a parent's representative contact sets it as the <strong>Parent Login ID</strong>. Only <strong>Admin &amp; Vice Admin</strong> can generate or change passwords; teachers can view their own class parents' ID &amp; password in <strong>Parent Biodata</strong> to share with parents.
          </div>
          ${canEdit ? `
            <div class="form-row" style="background:#f8fafc; padding:12px; border-radius:8px; border:1px solid var(--border); flex-wrap:wrap;">
              <input type="text" id="bioLrn" placeholder="LRN" style="width:120px;" />
              <input type="text" id="bioName" placeholder="Full Name" style="width:150px;" />
              <input type="text" id="bioLevel" placeholder="Level (e.g. Grade 7)" style="width:130px;" />
              <input type="text" id="bioSection" placeholder="Section" style="width:95px;" />
              <input type="text" id="bioGuardian" placeholder="Parent / Guardian" style="width:140px;" />
              <input type="text" id="bioPhone" placeholder="Parent Contact (Login ID)" style="width:170px;" />
              <input type="email" id="bioEmail" placeholder="Parent Email" style="width:165px;" />
              <input type="text" id="bioFbMessenger" placeholder="FB Messenger ID" style="width:155px;" />
              <input type="text" id="bioAddress" placeholder="Address" style="width:170px;" />
              <button class="btn" onclick="addStudent()">+ Add Student</button>
            </div>
          ` : ''}
          <div class="table-wrap">
            <table>
              <thead><tr><th>LRN</th><th>Full Name</th><th>Level & Section</th><th>Guardian</th><th>Parent Contact (ID)</th><th>Parent Email</th><th>FB Messenger ID</th><th>Address</th></tr></thead>
              <tbody>
                ${students.map((s, idx) => `
                  <tr>
                    <td>${s.lrn}</td>
                    <td><strong>${s.name}</strong></td>
                    <td>${s.level} - ${s.section}</td>
                    <td><input type="text" value="${s.guardian || ''}" style="width:130px;" onchange="updateStudentParentInfo(${idx}, 'guardian', this.value)" /></td>
                    <td><input type="text" value="${s.phone || ''}" style="width:135px;" onchange="updateStudentParentInfo(${idx}, 'phone', this.value)" /></td>
                    <td><input type="email" value="${s.email || ''}" placeholder="Parent Email" style="width:160px;" onchange="updateStudentParentInfo(${idx}, 'email', this.value)" /></td>
                    <td><input type="text" value="${s.fbMessenger || ''}" placeholder="FB Messenger ID" style="width:140px;" onchange="updateStudentParentInfo(${idx}, 'fbMessenger', this.value)" /></td>
                    <td><input type="text" value="${s.address || ''}" style="width:100%; min-width:180px;" onchange="updateStudentParentInfo(${idx}, 'address', this.value)" /></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function updateStudentParentInfo(idx, field, val) {
      const s = students[idx];
      if (!s) return;
      s[field] = val.trim();
      if (field === 'phone') {
        s.parentId = normalizePhone(s.phone);
      }
      if (s.phone) {
        const canManagePW = currentRole === 'admin' || currentRole === 'vice_admin';
        const acc = ensureParentAccount(s.guardian, s.phone, s.address, canManagePW, s.fbMessenger, s.email);
        if (field === 'email' && acc) {
          acc.email = s.email;
        }
        if (field === 'fbMessenger' && acc) {
          acc.fbMessenger = s.fbMessenger;
        }
      }
      render();
    }

    function updateParentEmail(phoneKey, val) {
      const trimmed = val.trim();
      if (parentAccounts[phoneKey]) {
        parentAccounts[phoneKey].email = trimmed;
      }
      students.forEach(s => {
        if (normalizePhone(s.phone) === phoneKey) {
          s.email = trimmed;
        }
      });
      scheduleSave();
    }

    function renderParentBiodata() {
      const canManagePW = currentRole === 'admin' || currentRole === 'vice_admin';
      const isTeacher = currentRole === 'teacher';

      const buildParentRows = (targetStudents) => {
        const byParent = {};
        targetStudents.forEach(s => {
          const key = normalizePhone(s.phone) || `no-phone-${s.id}`;
          if (!byParent[key]) {
            const acc = normalizePhone(s.phone) ? ensureParentAccount(s.guardian, s.phone, s.address, false, s.fbMessenger, s.email) : null;
            byParent[key] = {
              key,
              guardian: (acc && acc.guardian) || s.guardian || '-',
              loginId: (acc && acc.loginId) || s.phone || '(Not Set)',
              email: (acc && acc.email) || s.email || '',
              fbMessenger: (acc && acc.fbMessenger) || s.fbMessenger || '-',
              password: (acc && acc.password) || '',
              address: (acc && acc.address) || s.address || '-',
              hasAccount: !!acc,
              children: []
            };
          }
          byParent[key].children.push(`${s.name} (${s.section})`);
        });
        return Object.values(byParent);
      };

      const renderParentTable = (title, rows, studentColLabel) => `
        <div style="margin-bottom:20px;">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
            <h3 style="font-size:1rem; color:var(--primary);">${title} <span class="badge badge-blue" style="margin-left:6px;">${rows.length} Parent Account(s)</span></h3>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Parent / Guardian</th>
                  <th>${studentColLabel}</th>
                  <th>Contact / Login ID</th>
                  <th>Email</th>
                  <th>FB Messenger ID</th>
                  <th>Password</th>
                  <th>Address</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                ${rows.length ? rows.map(p => `
                  <tr>
                    <td><strong>${p.guardian}</strong></td>
                    <td>${p.children.join(', ')}</td>
                    <td><code style="background:#eff6ff; color:#1e40af; padding:3px 7px; border-radius:6px; font-weight:700;">${p.loginId}</code></td>
                    <td>
                      ${p.hasAccount
                        ? `<input type="email" value="${p.email}" placeholder="parent@email.com" style="width:165px;" onchange="updateParentEmail('${p.key}', this.value)" />`
                        : `<span style="color:var(--muted);">${p.email || '-'}</span>`}
                    </td>
                    <td style="font-size:0.88rem;">${p.fbMessenger || '-'}</td>
                    <td>
                      ${p.password
                        ? `<code style="background:#fef3c7; color:#92400e; padding:3px 7px; border-radius:6px; font-weight:700;">${p.password}</code>`
                        : `<span class="badge badge-yellow">Not Generated Yet</span>`}
                    </td>
                    <td style="font-size:0.85rem; color:var(--muted);">${p.address}</td>
                    <td style="white-space:nowrap;">
                      ${p.hasAccount ? `
                        ${p.password ? `
                          <button class="btn btn-sm btn-outline" onclick="copyParentCredential('${p.key}')">📋 Copy</button>
                        ` : (isTeacher ? '<span style="color:var(--muted); font-size:0.8rem;">Admin sets PW</span>' : '')}
                        ${canManagePW ? (p.password ? `
                          <button class="btn btn-sm" onclick="resetParentPassword('${p.key}')">🔄 Reset PW</button>
                          <button class="btn btn-sm btn-outline" onclick="changeParentPassword('${p.key}')">✏️ Change PW</button>
                        ` : `
                          <button class="btn btn-sm" onclick="generateParentPasswordFor('${p.key}')">🔑 Generate PW</button>
                        `) : ''}
                      ` : '<span style="color:var(--muted); font-size:0.8rem;">Add contact first</span>'}
                    </td>
                  </tr>
                `).join('') : `<tr><td colspan="8" style="color:var(--muted); text-align:center;">No parents registered for ${title} yet.</td></tr>`}
              </tbody>
            </table>
          </div>
        </div>
      `;

      if (isTeacher) {
        const classStudents = students.filter(s => `${s.level} - ${s.section}` === teacherAssignedClass);
        const rows = buildParentRows(classStudents);
        return `
          <div class="card">
            <div class="card-header">
              <div class="card-title">👨‍👩‍👧‍👦 Parent Biodata & Login Credentials</div>
              <span class="badge badge-blue">My Class Only: ${teacherAssignedClass}</span>
            </div>
            <div class="notice" style="margin-bottom:16px;">
              📨 You can view parents in your assigned class (<strong>${teacherAssignedClass}</strong>) and copy/send their login ID &amp; password. Generating or changing passwords is restricted to <strong>Admin &amp; Vice Admin</strong>.
            </div>
            ${renderParentTable(teacherAssignedClass, rows, `Student(s) in ${teacherAssignedClass}`)}
          </div>
        `;
      }

      const allGrades = [...new Set([
        ...gradeSections.map(g => g.grade),
        ...students.map(s => s.level)
      ])].filter(Boolean).sort();

      const gradesToShow = parentGradeFilter === 'ALL' ? allGrades : allGrades.filter(g => g === parentGradeFilter);

      const gradeBlocks = gradesToShow.map(grade => {
        const gradeStudents = students.filter(s => s.level === grade);
        const rows = buildParentRows(gradeStudents);
        return renderParentTable(grade, rows, `Student(s) in ${grade}`);
      }).join('');

      return `
        <div class="card">
          <div class="card-header">
            <div class="card-title">👨‍👩‍👧‍👦 Parent Biodata & Login Credentials (By Grade Level)</div>
            <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
              <select onchange="parentGradeFilter=this.value; render();">
                <option value="ALL" ${parentGradeFilter==='ALL'?'selected':''}>All Grade Levels</option>
                ${allGrades.map(g => `<option value="${g}" ${parentGradeFilter===g?'selected':''}>${g}</option>`).join('')}
              </select>
              <span class="badge badge-red">PW Manage: Admin &amp; Vice Admin Only</span>
            </div>
          </div>
          <div class="notice" style="margin-bottom:16px;">
            🔑 <strong>Admin &amp; Vice Admin</strong> can generate, reset, or change parent passwords. Class teachers can view and send credentials for their own assigned class only.
          </div>
          ${gradeBlocks || '<div class="notice">No grade levels found.</div>'}
        </div>
      `;
    }

    function generateParentPasswordFor(phoneKey) {
      if (currentRole !== 'admin' && currentRole !== 'vice_admin') {
        return alert('Only Admin and Vice Admin can generate passwords.');
      }
      if (!parentAccounts[phoneKey]) return;
      parentAccounts[phoneKey].password = generateParentPassword();
      render();
    }

    function resetParentPassword(phoneKey) {
      if (currentRole !== 'admin' && currentRole !== 'vice_admin') {
        return alert('Only Admin and Vice Admin can reset passwords.');
      }
      if (!parentAccounts[phoneKey]) return;
      parentAccounts[phoneKey].password = generateParentPassword();
      render();
    }

    function changeParentPassword(phoneKey) {
      if (currentRole !== 'admin' && currentRole !== 'vice_admin') {
        return alert('Only Admin and Vice Admin can change passwords.');
      }
      const acc = parentAccounts[phoneKey];
      if (!acc) return;
      const newPw = prompt(`Enter new password for ${acc.guardian} (${acc.loginId}):`, acc.password || '');
      if (newPw === null) return;
      const trimmed = newPw.trim();
      if (!trimmed) return alert('Password cannot be empty.');
      acc.password = trimmed;
      render();
    }

    function buildParentShareText(acc) {
      return `[Paradise Mission Academy]\nParent: ${acc.guardian}\nLogin ID: ${acc.loginId}\nPassword: ${acc.password}`;
    }

    function copyParentCredential(phoneKey) {
      const acc = parentAccounts[phoneKey];
      if (!acc || !acc.password) return alert('Password has not been generated by Admin/Vice Admin yet.');
      const text = buildParentShareText(acc);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => alert('Copied login info to share:\n\n' + text));
      } else {
        alert(text);
      }
    }

    function renderStaffBiodata() {
      const canEdit = currentRole === 'admin' || currentRole === 'vice_admin';
      return `
        <div class="card">
          <div class="card-header">
            <div class="card-title">👩‍🏫 Teacher & Staff Biodata (Phone = Login ID)</div>
            <span class="badge badge-red">Admin & Vice Admin</span>
          </div>
          <div class="notice" style="margin-bottom:14px;">
            🔑 <strong>Contact (Phone Number)</strong> is used as the <strong>Login ID</strong> for staff and teachers. Admin can create or change passwords here and click <strong>Copy</strong> to share them.
          </div>
          ${canEdit ? `
            <div class="form-row" style="background:#f8fafc; padding:12px; border-radius:8px; border:1px solid var(--border); flex-wrap:wrap;">
              <input type="text" id="staffName" placeholder="Full Name" style="width:140px;" />
              <select id="staffRole" style="width:125px;">
                <option value="Teacher">Teacher</option>
                <option value="Staff">Staff</option>
              </select>
              <input type="text" id="staffContact" placeholder="Phone (Login ID)" style="width:145px;" />
              <input type="text" id="staffPassword" placeholder="Password (auto if blank)" style="width:165px;" />
              <input type="email" id="staffEmail" placeholder="Email" style="width:155px;" />
              <input type="text" id="staffAddress" placeholder="Address" style="width:155px;" />
              <input type="date" id="staffHireDate" style="width:135px;" />
              <input type="text" id="staffQual" placeholder="Qualifications" style="width:160px;" />
              <button class="btn" onclick="addStaffBiodata()">+ Add Staff</button>
            </div>
          ` : ''}
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Role</th>
                  <th>Contact (Login ID)</th>
                  <th>Password</th>
                  <th>Email</th>
                  <th>Address</th>
                  <th>Hire Date</th>
                  <th>Qualifications</th>
                  ${canEdit ? '<th>Action</th>' : ''}
                </tr>
              </thead>
              <tbody>
                ${staffBiodata.map((st, idx) => `
                  <tr>
                    <td><input type="text" value="${st.name || ''}" style="width:125px; font-weight:600;" onchange="updateStaffField(${idx}, 'name', this.value)" /></td>
                    <td>
                      <select onchange="updateStaffField(${idx}, 'role', this.value, true)">
                        <option value="Teacher" ${st.role==='Teacher'?'selected':''}>Teacher</option>
                        <option value="Staff" ${st.role!=='Teacher'?'selected':''}>Staff</option>
                      </select>
                    </td>
                    <td><input type="text" value="${st.contact || ''}" placeholder="0917-000-0000" style="width:130px; font-weight:600; color:#1e40af;" onchange="updateStaffField(${idx}, 'contact', this.value)" /></td>
                    <td style="white-space:nowrap;">
                      ${st.password
                        ? `<code style="background:#fef3c7; color:#92400e; padding:3px 7px; border-radius:6px; font-weight:700;">${st.password}</code>`
                        : `<span class="badge badge-yellow">Not Set</span>`}
                    </td>
                    <td><input type="email" value="${st.email || ''}" placeholder="Email" style="width:150px;" onchange="updateStaffField(${idx}, 'email', this.value)" /></td>
                    <td><input type="text" value="${st.address || ''}" style="width:140px;" onchange="updateStaffField(${idx}, 'address', this.value)" /></td>
                    <td><input type="date" value="${st.hireDate || ''}" onchange="updateStaffField(${idx}, 'hireDate', this.value)" /></td>
                    <td><input type="text" value="${st.qualifications || ''}" style="width:150px;" onchange="updateStaffField(${idx}, 'qualifications', this.value)" /></td>
                    ${canEdit ? `
                      <td style="white-space:nowrap;">
                        ${st.password ? `<button class="btn btn-sm btn-outline" onclick="copyStaffCredential(${idx})">📋 Copy</button>` : ''}
                        <button class="btn btn-sm" onclick="resetStaffPassword(${idx})">${st.password ? '🔄 Reset' : '🔑 Generate'}</button>
                        <button class="btn btn-sm btn-outline" onclick="changeStaffPassword(${idx})">✏️ PW</button>
                        <button class="btn btn-sm btn-danger" onclick="removeStaffBiodata(${idx})">Delete</button>
                      </td>
                    ` : ''}
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function findCoAdminForStaff(st, oldPhoneNorm = '') {
      if (!st) return null;
      const curNorm = normalizePhone(st.contact);
      return coAdmins.find(ca =>
        (ca.staffId && ca.staffId === st.id) ||
        (oldPhoneNorm && normalizePhone(ca.phone) === oldPhoneNorm) ||
        (curNorm && normalizePhone(ca.phone) === curNorm)
      ) || null;
    }

    function updateStaffField(idx, field, val, shouldRender = false) {
      const st = staffBiodata[idx];
      if (!st) return;
      const oldPhoneNorm = normalizePhone(st.contact);
      st[field] = val.trim();
      const linkedCoAdmin = findCoAdminForStaff(st, oldPhoneNorm);
      if (linkedCoAdmin) {
        if (field === 'name') linkedCoAdmin.name = st.name;
        if (field === 'role') linkedCoAdmin.role = st.role;
        if (field === 'contact') linkedCoAdmin.phone = st.contact;
      }
      if (field === 'contact' && currentPhoneSession && normalizePhone(currentPhoneSession.phone) === oldPhoneNorm) {
        currentPhoneSession.phone = st.contact;
        try { sessionStorage.setItem('pma_phone_session', JSON.stringify(currentPhoneSession)); } catch (_) {}
      }
      if (shouldRender) render();
      else scheduleSave();
    }

    function addStaffBiodata() {
      const name = document.getElementById('staffName').value.trim();
      const role = document.getElementById('staffRole').value;
      const contact = document.getElementById('staffContact').value.trim();
      const customPw = document.getElementById('staffPassword').value.trim();
      const email = document.getElementById('staffEmail').value.trim();
      const address = document.getElementById('staffAddress').value.trim();
      const hireDate = document.getElementById('staffHireDate').value;
      const qualifications = document.getElementById('staffQual').value.trim();
      if (!name) return alert('Please enter staff full name.');
      if (!contact) return alert('Please enter Contact / Phone Number (used as Login ID).');
      const password = customPw || generateParentPassword();
      staffBiodata.push({ id: Date.now(), name, role, contact, password, email, address, hireDate, qualifications });
      alert(`Staff account created!\n\nName: ${name}\nRole: ${role}\nLogin ID (Phone): ${contact}\nPassword: ${password}`);
      render();
    }

    function resetStaffPassword(idx) {
      if (currentRole !== 'admin' && currentRole !== 'vice_admin') {
        return alert('Only Admin and Vice Admin can manage staff passwords.');
      }
      const st = staffBiodata[idx];
      if (!st) return;
      const newPw = generateParentPassword();
      st.password = newPw;
      const linkedCoAdmin = findCoAdminForStaff(st);
      if (linkedCoAdmin) linkedCoAdmin.password = newPw;
      if (currentPhoneSession && normalizePhone(currentPhoneSession.phone) === normalizePhone(st.contact)) {
        currentPhoneSession.password = newPw;
        try { sessionStorage.setItem('pma_phone_session', JSON.stringify(currentPhoneSession)); } catch (_) {}
      }
      render();
    }

    function changeStaffPassword(idx) {
      if (currentRole !== 'admin' && currentRole !== 'vice_admin') {
        return alert('Only Admin and Vice Admin can change staff passwords.');
      }
      const st = staffBiodata[idx];
      if (!st) return;
      const newPw = prompt(`Enter new password for ${st.name} (${st.contact}):`, st.password || '');
      if (newPw === null) return;
      const trimmed = newPw.trim();
      if (!trimmed) return alert('Password cannot be empty.');
      st.password = trimmed;
      const linkedCoAdmin = findCoAdminForStaff(st);
      if (linkedCoAdmin) linkedCoAdmin.password = trimmed;
      if (currentPhoneSession && normalizePhone(currentPhoneSession.phone) === normalizePhone(st.contact)) {
        currentPhoneSession.password = trimmed;
        try { sessionStorage.setItem('pma_phone_session', JSON.stringify(currentPhoneSession)); } catch (_) {}
      }
      render();
    }

    function copyStaffCredential(idx) {
      const st = staffBiodata[idx];
      if (!st || !st.password) return alert('Password is not set yet.');
      const text = `[Paradise Mission Academy]\nName: ${st.name} (${st.role})\nLogin ID (Phone): ${st.contact}\nPassword: ${st.password}`;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => alert('Copied login info to share:\n\n' + text));
      } else {
        alert(text);
      }
    }

    function removeStaffBiodata(idx) {
      const st = staffBiodata[idx];
      if (!st) return;
      const linkedIdx = coAdmins.findIndex(ca =>
        (ca.staffId && ca.staffId === st.id) ||
        (normalizePhone(st.contact) && normalizePhone(ca.phone) === normalizePhone(st.contact))
      );
      if (linkedIdx !== -1 && isPrimaryAdmin()) {
        coAdmins.splice(linkedIdx, 1);
      }
      staffBiodata.splice(idx, 1);
      render();
    }

    function addStudent() {
      const lrn = document.getElementById('bioLrn').value.trim();
      const name = document.getElementById('bioName').value.trim();
      const level = document.getElementById('bioLevel').value.trim() || 'Grade 7';
      const section = document.getElementById('bioSection').value.trim() || 'A';
      const guardian = document.getElementById('bioGuardian').value.trim();
      const phone = document.getElementById('bioPhone').value.trim();
      const email = document.getElementById('bioEmail').value.trim();
      const fbMessenger = document.getElementById('bioFbMessenger').value.trim();
      const address = document.getElementById('bioAddress').value.trim();
      if (!lrn || !name) return alert('Please enter LRN and Full Name.');
      if (!phone) return alert('Please enter Parent Contact (used as Parent Login ID).');
      const newId = students.length ? Math.max(...students.map(s => s.id)) + 1 : 1;
      const parentKey = normalizePhone(phone);
      const canManagePW = currentRole === 'admin' || currentRole === 'vice_admin';
      const isNewParent = !parentAccounts[parentKey];
      const acc = ensureParentAccount(guardian, phone, address, canManagePW, fbMessenger, email);
      students.push({ id: newId, lrn, name, level, section, guardian, phone, email, fbMessenger, address, parentId: parentKey });
      bills.push({ id: Date.now(), studentId: newId, tuitionFee: 0, miscFee: 0, bookFee: 0, paid: 0, receipts: [] });
      if (isNewParent && acc) {
        if (canManagePW && acc.password) {
          alert(`Student added!\nParent Account created:\nID: ${acc.loginId}\nPassword: ${acc.password}`);
        } else {
          alert(`Student added!\nParent Login ID registered: ${acc.loginId}\n(Admin or Vice Admin can generate the password in Parent Biodata.)`);
        }
      }
      render();
    }

    function renderBills() {
      const canEdit = currentRole === 'admin' || currentRole === 'vice_admin' || currentRole === 'cashier';
      const visibleBills = currentRole === 'parent'
        ? bills.filter(b => {
            const st = students.find(s => s.id === b.studentId);
            return st && normalizePhone(st.phone) === normalizePhone(currentParentPhone);
          })
        : bills;

      return `
        <div class="card">
          <div class="card-header">
            <div class="card-title">💳 Tuition Bills, Receipts & Balance</div>
            <span class="badge ${canEdit ? 'badge-green' : 'badge-blue'}">
              ${canEdit ? `${currentRole === 'admin' ? 'Admin' : 'Cashier'} Edit Mode` : 'Parent View (My Children Only)'}
            </span>
          </div>
          ${canEdit ? `
            <div class="form-row" style="background:#f8fafc; padding:12px; border-radius:8px; border:1px solid var(--border);">
              <select id="billStudentId">
                ${students.map(s => `<option value="${s.id}">${s.name} (${s.level})</option>`).join('')}
              </select>
              <input type="text" id="billOrNo" placeholder="OR No. (e.g. OR-2026-0301)" style="width:180px;" />
              <input type="date" id="billDate" value="${selectedDate}" />
              <input type="number" id="billAmount" placeholder="Amount (₱)" style="width:130px;" />
              <button class="btn" onclick="addPayment()">+ Record Payment</button>
            </div>
          ` : ''}
          <div class="table-wrap">
            <table>
              <thead><tr><th>Student</th><th>Tuition Fee</th><th>Misc. Fees</th><th>Book / Learning Material Fee</th><th>Total Fee</th><th>Paid</th><th>Balance</th><th>Receipts (OR No.)</th><th>Print</th></tr></thead>
              <tbody>
                ${visibleBills.map(b => {
                  const st = students.find(s => s.id === b.studentId);
                  const total = getBillTotal(b);
                  const bal = total - b.paid;
                  return `
                    <tr>

    function updateFinanceEntry(idx, field, val) {

      render();

    function deleteFinanceEntry(idx) {
      financeLogs.splice(idx, 1);

    function normalizeExcelDate(val) {
      if (!val) return selectedDate;
      if (typeof val === 'number') {
        const utcDays = Math.floor(val - 25569);
        const d = new Date(utcDays * 86400 * 1000);
        if (!isNaN(d.getTime())) return d.toISOString().slice(0, 10);
      }
      const str = String(val).trim();
      const match = str.match(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
      if (match) return `${match[1]}-${match[2].padStart(2, '0')}-${match[3].padStart(2, '0')}`;
      return selectedDate;
    }

    function normalizeFinanceType(val) {
      const s = String(val || '').trim().toLowerCase();
      if (['income', 'in', 'credit'].includes(s)) return 'Income';
      if (['expense', 'out', 'debit'].includes(s)) return 'Expense';
      return 'Expense';
    }

    function parseFinanceRows(rows) {
      let added = 0;
      rows.forEach(row => {
        const keys = Object.keys(row);
        const findVal = (candidates) => {
          const k = keys.find(key => candidates.includes(key.trim().toLowerCase()));
          return k !== undefined ? row[k] : '';
        };
        const rawDate = findVal(['date']);
        const rawDesc = findVal(['description', 'desc', 'item', 'particulars']);
        const rawType = findVal(['type', 'category']);
        const rawAmount = findVal(['amount', 'price', 'total']);

        const desc = String(rawDesc || '').trim();
        const amount = Number(String(rawAmount || '0').replace(/[^0-9.-]/g, ''));
        if (!desc || !amount) return;

        financeLogs.push({
          id: Date.now() + Math.floor(Math.random() * 10000),
          date: normalizeExcelDate(rawDate),
          desc,
          type: rawType ? normalizeFinanceType(rawType) : (amount < 0 ? 'Expense' : 'Income'),
          amount: Math.abs(amount)
        });
        added++;
      });
      return added;
    }

    function importFinanceExcel(input) {
      const file = input.files[0];
      const nameEl = document.getElementById('financeFileName');
      if (!file) {
        if (nameEl) nameEl.textContent = 'No file chosen';
        return;
      }
      if (nameEl) nameEl.textContent = file.name;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          let rows = [];
          if (typeof XLSX !== 'undefined') {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, { type: 'array' });
            const sheet = wb.Sheets[wb.SheetNames[0]];
            rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
          } else if (file.name.toLowerCase().endsWith('.csv')) {
            const text = new TextDecoder('utf-8').decode(e.target.result);
            const lines = text.split(/\r?\n/).filter(l => l.trim());
            const headers = lines[0].split(',').map(h => h.trim());
            rows = lines.slice(1).map(line => {
              const cols = line.split(',');
              const obj = {};
              headers.forEach((h, i) => obj[h] = (cols[i] || '').trim());
              return obj;
            });
          } else {
            return alert('Excel library not loaded (offline). Please upload a .csv file or check internet connection.');
          }
          const added = parseFinanceRows(rows);
          if (added > 0) {
            alert(`Successfully imported ${added} item(s) from "${file.name}".`);
            render();
          } else {
            alert('No valid rows found. Please check columns: Date, Description, Type (Income/Expense), Amount.');
          }
        } catch (err) {
          alert('Failed to read file: ' + err.message);
        }
        input.value = '';
      };
      reader.readAsArrayBuffer(file);
    }

    function downloadFinanceTemplate() {
      const sample = [
        { Date: '2026-11-26', Description: 'School Supplies Purchase', Type: 'Expense', Amount: 3500 },
        { Date: '2026-11-26', Description: 'Mission Donation', Type: 'Income', Amount: 20000 }
      ];
      if (typeof XLSX !== 'undefined') {
        const ws = XLSX.utils.json_to_sheet(sample);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Finance');
        XLSX.writeFile(wb, 'school_finance_template.xlsx');
      } else {
        const csv = 'Date,Description,Type,Amount\n2026-11-26,School Supplies Purchase,Expense,3500\n2026-11-26,Mission Donation,Income,20000\n';
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'school_finance_template.csv';
        a.click();
      }
    }

    function addCoAdmin() {
      if (!isPrimaryAdmin()) return alert('Only the Primary Admin (Supabase Login) can register Co-Admins.');
      if (coAdmins.length >= MAX_CO_ADMINS) return alert(`You can register up to ${MAX_CO_ADMINS} Co-Admins.`);
