      const staffId = Number(selectEl ? selectEl.value : 0);
      const note = (document.getElementById('coAdminNote') ? document.getElementById('coAdminNote').value : '').trim();
      if (!staffId) return alert('Please select a person from Teacher & Staff Biodata.');
      const st = staffBiodata.find(s => s.id === staffId);
      if (!st) return alert('Selected staff member was not found.');
      const norm = normalizePhone(st.contact);
      if (!norm) return alert('This person has no phone number in Teacher & Staff Biodata.');
      if (coAdmins.some(ca => (ca.staffId && ca.staffId === st.id) || normalizePhone(ca.phone) === norm)) {
        return alert('This person is already registered as a Co-Admin.');
      }
      if (!st.password) {
        st.password = generateParentPassword();
      }
      coAdmins.push({
        id: Date.now(),
        staffId: st.id,
        name: st.name,
        role: st.role,
        phone: st.contact,
        password: st.password,
        note
      });
      alert(`Co-Admin account assigned!\n\nName: ${st.name} (${st.role})\nLogin ID (Phone): ${st.contact}\nPassword: ${st.password}`);
      render();
    }

    function resetCoAdminPassword(idx) {
      if (!isPrimaryAdmin()) return alert('Only the Primary Admin can change passwords.');
      const ca = coAdmins[idx];
      if (!ca) return;
      const newPw = generateParentPassword();
      ca.password = newPw;
      const linkedStaff = findStaffForCoAdmin(ca);
      if (linkedStaff) linkedStaff.password = newPw;
      render();
    }

    function changeCoAdminPassword(idx) {
      if (!isPrimaryAdmin()) return alert('Only the Primary Admin can change passwords.');
      const ca = coAdmins[idx];
      if (!ca) return;
      const newPw = prompt(`Enter a new password (${ca.name} · ${ca.phone}):`, ca.password || '');
      if (newPw === null) return;
      const trimmed = newPw.trim();
      if (!trimmed) return alert('Password cannot be empty.');
      ca.password = trimmed;
      const linkedStaff = findStaffForCoAdmin(ca);
      if (linkedStaff) linkedStaff.password = trimmed;
      render();
    }

    function copyCoAdminCredential(idx) {
      if (!isPrimaryAdmin()) return;
      const ca = coAdmins[idx];
      if (!ca || !ca.password) return;
      const text = `[Paradise Mission Academy - Co-Admin]\nName: ${ca.name}\nLogin ID (Phone): ${ca.phone}\nPassword: ${ca.password}`;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => alert('Login credentials copied:\n\n' + text));
      } else {
        alert(text);
      }
    }

    function removeCoAdmin(idx) {
      if (!isPrimaryAdmin()) return alert('Only the Primary Admin can delete accounts.');
      const ca = coAdmins[idx];
      if (!ca) return;
      if (!confirm(`Are you sure you want to delete Co-Admin "${ca.name}" (${ca.phone})?`)) return;
      coAdmins.splice(idx, 1);
      render();
    }

    function renderSettings() {
      const canEdit = currentRole === 'admin' || currentRole === 'vice_admin';
      const teachers = staffBiodata.filter(s => s.role === 'Teacher');
      return `
        <div class="card">
          <div class="card-header">
            <div class="card-title">⚙️ School Settings — Grade Levels, Sections & Teacher Assignment</div>
            <span class="badge badge-blue">${currentRole === 'admin' ? 'Admin' : 'Vice Admin'}</span>
          </div>
          ${canEdit ? `
            <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; align-items:center;">
              <input type="text" id="newGradeInput" placeholder="Grade Level (e.g. Grade 5)" style="padding:8px 12px; border:1px solid #cbd5e1; border-radius:6px;" />
              <input type="text" id="newSectionInput" placeholder="Section Name (e.g. Love)" style="padding:8px 12px; border:1px solid #cbd5e1; border-radius:6px;" />
              <button class="btn btn-primary" onclick="addGradeSection()">+ Add Grade & Section</button>
            </div>
          ` : ''}
          <div class="table-wrap">
            <table>
              <thead><tr><th>Grade Level</th><th>Sections & Assigned Teachers (Lead / Assistant)</th>${canEdit ? '<th>Action</th>' : ''}</tr></thead>
              <tbody>
                ${gradeSections.map((g, gi) => `
                  <tr>
                    <td><strong>${g.grade}</strong></td>
                    <td>
                      <div style="display:flex; flex-direction:column; gap:10px;">
                        ${g.sections.map((sec, si) => {
                          const classKey = `${g.grade} - ${sec}`;
                          const assigned = classTeacherAssignments[classKey] || { lead: '', assistant: '' };
                          return `
                            <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:#f8fafc; padding:8px 10px; border-radius:8px; border:1px solid var(--border);">
                              <span class="badge badge-blue">
                                ${sec}
                                ${canEdit ? `<button onclick="removeSection(${gi}, ${si})" style="background:none; border:none; color:inherit; cursor:pointer; margin-left:4px; font-weight:bold;">×</button>` : ''}
                              </span>
                              ${canEdit ? `
                                <label style="font-size:12px; color:#475569; font-weight:600;">Lead Teacher:
                                  <select onchange="assignClassTeacher('${classKey}', 'lead', this.value)" style="padding:4px 8px; border:1px solid #cbd5e1; border-radius:6px; font-size:13px; margin-left:4px;">
                                    <option value="">-- Unassigned --</option>
                                    ${teachers.map(t => `<option value="${t.name}" ${assigned.lead===t.name?'selected':''}>${t.name}</option>`).join('')}
                                  </select>
                                </label>
                                <label style="font-size:12px; color:#475569; font-weight:600;">Assistant Teacher:
                                  <select onchange="assignClassTeacher('${classKey}', 'assistant', this.value)" style="padding:4px 8px; border:1px solid #cbd5e1; border-radius:6px; font-size:13px; margin-left:4px;">
                                    <option value="">-- Unassigned --</option>
                                    ${teachers.map(t => `<option value="${t.name}" ${assigned.assistant===t.name?'selected':''}>${t.name}</option>`).join('')}
                                  </select>
                                </label>
                              ` : `<span style="font-size:13px; color:#475569;">Lead: <strong>${assigned.lead || 'Unassigned'}</strong> | Assistant: <strong>${assigned.assistant || 'Unassigned'}</strong></span>`}
                            </div>
                          `;
                        }).join('')}
                      </div>
                    </td>
                    ${canEdit ? `<td><button class="btn btn-sm btn-danger" onclick="removeGrade(${gi})">Delete Grade</button></td>` : ''}
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function assignClassTeacher(classKey, slot, teacherName) {
      if (!classTeacherAssignments[classKey]) {
        classTeacherAssignments[classKey] = { lead: '', assistant: '' };
      }
      classTeacherAssignments[classKey][slot] = teacherName;
      if (teacherName) teacherAssignedClass = classKey;
      render();
    }


    function addGradeSection() {
      const grade = document.getElementById('newGradeInput').value.trim();
      const section = document.getElementById('newSectionInput').value.trim();
      if (!grade || !section) return alert('Please enter both Grade Level and Section Name.');
      const existing = gradeSections.find(g => g.grade.toLowerCase() === grade.toLowerCase());
      if (existing) {
        if (!existing.sections.includes(section)) existing.sections.push(section);
      } else {
        gradeSections.push({ grade, sections: [section] });
        parentAccessByGrade.push({ grade, calendar: true, grades: true, bills: true });
      }
      render();
    }

    function removeSection(gi, si) {
      gradeSections[gi].sections.splice(si, 1);
      if (gradeSections[gi].sections.length === 0) removeGrade(gi);
      else render();
    }

    function removeGrade(gi) {
      const removed = gradeSections.splice(gi, 1)[0];
      if (removed) {
        const idx = parentAccessByGrade.findIndex(p => p.grade === removed.grade);
        if (idx !== -1) parentAccessByGrade.splice(idx, 1);
      }
      render();
    }

    // --- SUPABASE STATE SYNC ---
    function setSaveStatus(text) {
      const el = document.getElementById('saveStatus');
      if (el) el.textContent = text;
    }

    function getPortalState() {
      return {
        calendarEvents,
        students,
        parentAccounts,
        attendance,
        grades,
        gradeComments,
        bills,
        financeLogs,
        coAdmins,
        staffBiodata,
        staffAccessRules,
        gradeSections,
        parentAccessByGrade,
        classTeacherAssignments,
        rolePermissions,
        teacherAssignedClass
      };
    }

    function applyPortalState(data) {
      if (!data || typeof data !== 'object') return;
      const replaceArr = (target, src) => {
        if (Array.isArray(src)) { target.length = 0; target.push(...src); }
      };
      const replaceObj = (target, src) => {
        if (src && typeof src === 'object' && !Array.isArray(src)) {
          Object.keys(target).forEach(k => delete target[k]);
          Object.assign(target, src);
        }
      };
      replaceArr(calendarEvents, data.calendarEvents);
      replaceArr(students, data.students);
      replaceObj(parentAccounts, data.parentAccounts);
      replaceObj(attendance, data.attendance);
      replaceObj(grades, data.grades);
      replaceObj(gradeComments, data.gradeComments);
      replaceArr(bills, data.bills);
      replaceArr(financeLogs, data.financeLogs);
      replaceArr(coAdmins, data.coAdmins);
      replaceArr(staffBiodata, data.staffBiodata);
      staffBiodata.forEach(st => {
        st.role = st.role === 'Teacher' ? 'Teacher' : 'Staff';
      });
      replaceArr(staffAccessRules, data.staffAccessRules);
      replaceArr(gradeSections, data.gradeSections);
      replaceArr(parentAccessByGrade, data.parentAccessByGrade);
      replaceObj(classTeacherAssignments, data.classTeacherAssignments);
      replaceObj(rolePermissions, data.rolePermissions);
      if (typeof data.teacherAssignedClass === 'string') {
        teacherAssignedClass = data.teacherAssignedClass;
      }
    }

    async function loadPortalState() {
      if (!supabaseClient) return;
      isLoadingState = true;
      setSaveStatus('Loading...');
      try {
        const { data, error } = await supabaseClient
          .from('portal_state')
          .select('data')
          .eq('id', 'main')
          .maybeSingle();
        if (error) throw error;
        if (data && data.data) {
          applyPortalState(data.data);
        } else {
          await savePortalState();
        }
        setSaveStatus('Synced');
      } catch (err) {
        console.error('loadPortalState error:', err);
        setSaveStatus('Load Error');
      } finally {
        isLoadingState = false;
      }
    }

    function scheduleSave() {
      if (!supabaseClient || !isAuthenticated) return;
      if (currentRole === 'parent') return;
      setSaveStatus('Saving...');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(savePortalState, 600);
    }

    async function savePortalState() {
      if (!supabaseClient || !isAuthenticated) return;
      if (currentRole === 'parent') return;
      try {
        if (authMode === 'supabase') {
          const { error } = await supabaseClient
            .from('portal_state')
            .upsert({ id: 'main', data: getPortalState(), updated_at: new Date().toISOString() });
          if (error) throw error;
        } else if (authMode === 'phone' && currentPhoneSession) {
          const { data, error } = await supabaseClient.rpc('portal_phone_save', {
            p_phone: currentPhoneSession.phone,
            p_password: currentPhoneSession.password,
            p_data: getPortalState()
          });
          if (error) throw error;
          if (!data || !data.ok) throw new Error((data && data.error) || 'You do not have permission to save.');
        }
        setSaveStatus('Saved');
      } catch (err) {
        console.error('savePortalState error:', err);
        setSaveStatus('Save Failed');
      }
    }

    async function initApp() {
      if (!isSupabaseConfigured) {
        const notice = document.getElementById('supabaseNotice');
        if (notice) notice.style.display = 'block';
        return;
      }
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session && session.user) {
          await onAdminAuthenticated(session.user);
          return;
        }
        const savedPhone = sessionStorage.getItem('pma_phone_session');
        if (savedPhone) {
          const parsed = JSON.parse(savedPhone);
          if (parsed && parsed.phone && parsed.password) {
            await loginWithPhone(parsed.phone, parsed.password);
          }
        }
      } catch (err) {
        console.error('initApp error:', err);
        try { sessionStorage.removeItem('pma_phone_session'); } catch (_) {}
      }
    }

    updateSidebar();
    render();
    initApp();
  </script>
</body>
</html>
